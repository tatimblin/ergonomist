name: Build and deploy

# Builds the paper and publishes it to Cloudflare. Runs on pushes to
# main, by hand, and when tristantimblin.dev deploys (a repository_dispatch of
# type "tristantimblin-deployed"), so a new post there is copied here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [tristantimblin-deployed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ergonomist-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check

      # CI is set, so a feed that can't be fetched falls back to the last good
      # copy (/wire.json) or fails the build.
      - run: bun run build

      # wrangler.jsonc: a Worker serving dist/ as static assets.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
