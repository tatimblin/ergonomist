name: Check and deploy

# Checks the paper on every pull request, and deploys it to Cloudflare once
# the checks pass: on pushes to main, by hand, and when tristantimblin.dev
# deploys (a repository_dispatch of type "tristantimblin-deployed"), so a new
# post there is copied here. A pull request is checked, never deployed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [tristantimblin-deployed]

permissions:
  contents: read

jobs:
  # `astro check`, the build, and `bun run test` over it (scripts/test.ts):
  # once as it's published, and once with the drafts (INCLUDE_DRAFTS=1), so
  # the example drafts' pages are checked too.
  checks:
    name: checks (${{ matrix.drafts && 'with drafts' || 'published' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drafts: [false, true]
    env:
      INCLUDE_DRAFTS: ${{ matrix.drafts && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check

      # CI is set, so a feed that can't be fetched falls back to the last good
      # copy (/wire.json) or fails the build.
      - run: bun run build

      - run: bun run test

      # The published build is the one deployed.
      - if: ${{ !matrix.drafts }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ergonomist-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # For wrangler.
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # wrangler.jsonc: a Worker serving dist/ as static assets.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
