name: Build and deploy

# Builds the paper and publishes it to Cloudflare Pages. Runs on pushes to
# main, by hand, and when tristantimblin.dev deploys (a repository_dispatch of
# type "tristantimblin-deployed"), so a new post there is copied here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [tristantimblin-deployed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ergonomist --branch=main
